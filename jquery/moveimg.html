<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: #555;
            perspective: 1000px;
            transform-style: preserve-3d;
            display: flex;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
            
        }

        .card {
            pointer-events: none;
            transform: translateZ(0);
            padding: 5px;
            background: #fff;
            width:300px;
            height: 300px;
            margin: auto;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            display: flex;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            position: relative;
        }

        .card::after{
            content: '';
            position: absolute;
            width: 100%;
            height: 10px;
            border-radius: 50%;
            left: 0;
            bottom: -50px;
            box-shadow: 0 30px 20px rgba(0,0,0,0.4);
        }
        .card-content{
            margin: auto;
            text-align: center;
            transform-style: preserve-3d;
            position: relative;
        }

        .card-content img {
            width: 100%;
            height: 300px;
            border-radius: 5px;
        }
        .card-content::before{
            content: '';
            position: absolute;
            background: rgba(0,0,0,0.4);
            width: 100%;
            height: 300px;
        }

        h1{
            transform: translateZ(100px);
            position: absolute;
            top: 50px;
            left: 50px;
            font-weight: bolder;
            color: #fff;

        }

    </style>
</head>
<body>
    <div class="card">
        <div class="card-content">
            <img src="images/cat.jpeg" alt="">
            <h1>Please Hover Around</h1>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(document).on("mousemove",(e)=> {
            var width = - ($(window).innerWidth() / 2 - e.pageX) / 20;
            var height = - ($(window).innerHeight() / 2 - e.pageX / 10) ;
            $('.card').css("transform","rotateY("+width+"deg) rotateX("+height+"deg)")
        })

    </script>
</body>
</html>
