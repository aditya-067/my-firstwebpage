<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

<style>
body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#111;
}

#draggable-object{
width:120px;
height:120px;
background:rgba(255, 76, 76, 0.83);
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
cursor:move;
border-radius: 30px;
box-shadow: 0px 10px 30px rgba(255, 255, 255, 0.775);
}
h1{
    color: whitesmoke;
    position: absolute;
    top: 50px;
    font-size: 50px;
    text-decoration:overline;
    

}
</style>

</head>
<body>
<h1>Try Draggable</h1>

<div id="draggable-object">
Drag Me
</div>

<script>
$(function(){

$("#draggable-object").draggable({
axis:"x",          
containment:"body",
cursor:"move",
revert:true
});

});
</script>

</body>
</html>
