<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #box{
        width: 200px;
        height: 200px;
        background: red;
        box-shadow: 10px 10px 10px gray;
    }
    .mystyle
    {
        background-color: red;
        color: yellow;
        display: inline;
        font-size: 20px;
        padding: 5px;
        box-shadow: 10px 10px 10px gray;
        position: absolute;
        top: 10px;
        left: 130px;
        transition: 0.50s;
    }
</style>
<body onLoad="show()">
    <div id="box">box</div>
    <div id="tooltip"></div>
    <script>
        var b = document.getElementById("box")
        var t = document.getElementById("tooltip")


        b.style.background="green"
        b.style.width="40"
        b.style.background="url(image/bg12.jpg)"
        b.style.transition="0.50s"
          

        b.onclick=function()
        {
            this.style.background="url(image/bg11.jpg)"
            b.style.backgroundSize="cover"
            b.style.borderRadius="100px"
        }

        b.onmouseover = function()
        {
            b.style.cursor="pointer"
            t.innerHTML="Click to a picture"
            t.className="mystyle"
            document.title="Click To Change Picture"
        }


        b.onmouseout = function()
        {
            document.title=""
            this.style.background="url(image/bg12.jpg)"
            b.style.borderRadius="0px"
            t.innerHTML=""
            t.className=""
        }

        function redirect(){
            location.href="https://aditya-067.github.io/my-firstwebpage/"
        }

        function show ()
        {
            alert("you will be redirected in our new site ....\n since this site is under construction")
        }

        setTimeout("redirect()" ,10000)


        document.title="Ready"

    </script>
    
</body>
</html>
