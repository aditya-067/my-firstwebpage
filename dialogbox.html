<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .add1style
    {
        width: 250px;
        height: 250px;
        /* background: red; */
        border: 1px black solid;
        box-shadow: 10px 10px 10px gray;
        position: absolute;
        top: 0px;
        left: 0px;
        text-align: center;
    }
</style>
<body>
    <div id="add1"></div>
    <audio src="audio/notification-error-427345.mp3" type="audio/mpeg"></audio>
    <script>
        // Creating Custom Dilog box for Displaying Digital Content 

        // var add = document.getElementById("add1")
        var add = document. createElement("div")
        var s = document.getElementById("s")
        //var addpic
        document.body.appendChild(add)


        function showadd()
        {
            add.className="add1style"
            add.style.top="20%"
            add.style.left="30%"
            add.innerHTML="<button onclick='closediloge()' style='cursor:pointer;margin-left:100%;border-radius:100px;height:30px;margin-top:1px'>close</button>"
            add.innerHTML+="<h3>Sale on Amzone</h3> <hr/>"
            add.innerHTML+="<img id='addpic' src='image/prime1.gif'>"
            s.play()

            addpic = document.getElementById("addpic")
            addpic.onclick = function()
            {
                //Redirection 
                location.href="https://amazone.com"
            }

        }

        function closediloge()
        {
            document.body.removeChild(add)
        }

        setTimeout("showadd()",5000)
        setTimeout("document.body.removeChild(add)",20000)


        document.title="Ready"

    </script>
    
</body>
</html>
