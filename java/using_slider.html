<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #tool
    {
        background: gray;
        box-shadow: 10px 10px 10px gray;
        width: 100%;
    }

    #t {
        padding: 20px;
        text-align: justify;
    }
</style>

 
<body>
    <div id="tool">
        <span>Font Size <input id="fsize" type ="range" min="10" max="100" value="25"></span>
        <span>red <input id="red" type ="range" min="0" max="255" value="0"></span>
        <span>green <input id="green" type ="range" min="0" max="255" value="0"></span>
        <span>blue <input id="blue" type ="range" min="0" max="255" value="0"></span>
    </div>
    <h1>About us</h1>
    <p id="t">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Earum velit saepe provident unde ea adipisci beatae! Cum vero error nesciunt inventore dolorum quisquam, quia perspiciatis voluptas recusandae hic sit ipsam!</p>

   <script>
        var fsize = document.getElementById("fsize")
        var t = document.getElementById("t")


        var red = document.getElementById("red")
        var green = document.getElementById("green")
        var blue = document.getElementById("blue")

        fsize.onchange = function()
        {
            t.style.fontSize = this.value+"px"
        }

        red.onchange = function()
        {
            document.body.style.background = "rgb("+red.value+","+green.value+","+blue.value+")"
        }
        green.onchange = function()
        {
            document.body.style.background = "rgb("+red.value+","+green.value+","+blue.value+")"
        }
        blue.onchange = function()
        {
            document.body.style.background = "rgb("+red.value+","+green.value+","+blue.value+")"
        }


      
    </script>

</body>
</html>
