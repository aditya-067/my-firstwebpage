<head>

<style>
    .tree1{
        font-size: 140px;
        width: 70%;
        //background:green;

    body{
        text-align: center;

<body>
    <h1>Working With Do While Loop </h1>
    <script>
        var a = 1
        do{
            document.write("<span class='tree1'>&#127795;</span>")
            a++
        } while(a<=6)
        document.write("<span style='width:100%;background:black;display:block;height:100px;'></span>")

        var a = 1
        do
        {
            document.write("<span class='tree1'>&#127796;</span>")
            a++
        }while (a<=6)


        document.title="No Error"
    </script>
    
</body>
