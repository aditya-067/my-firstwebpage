<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .birdstyle {
            position: absolute;
            width: 20%;
            left: 0;
            top: 10px;
        }
        body{
            background-color: rgb(250, 250, 250);
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <script>
        var k ;
        var bird = document.createElement("img")
        document.body.appendChild(bird)
        bird.src="image/goku2.gif"
        bird.className="birdstyle"
        var L = 0
        var speed = 5
        function f1(e)
        {
            k = e.keyCode

            document.title = e.keyCode

            switch(k)
            // right Arrow 39,left 37 ,up 38 ,down 40
            {
                
                
                case  39:
               if(L<= window.innerWidth-150){
                bird.style.transform = "rotate(0deg)"
                L=L+speed
               }
                bird.style.left = L+"px"
                document.title = L

                break;


                case 37:
                    if(L>0)
                    {
                        L=L-speed 
                         bird.style.transform = "rotateY(-180deg)"
                    }
                // L=L-5
                bird.style.left = L+"px"
                
                break;
                case 38:

                 L=L-speed
                bird.style.top = L+"px"
                break;
                case 40:

                 L=L+speed
                bird.style.top = L+"px"
                break;
                
                case 32:

                speed++
                document.title = speed;
            }
        }
        document.title ="No Error"
     document.addEventListener("keydown",f1)
    </script>
</body>
</html>
