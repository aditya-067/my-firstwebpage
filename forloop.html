<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1{
        background-color: rgb(255, 155, 130);
        text-align: center;
        width: 20%;
        margin: auto;      
        border-radius: 30px;
        margin: 10px;
        margin-left: 60px;
        color: whitesmoke;
        border: 2px rgb(255, 255, 255) solid;
    
        
    }
    .box{
        width: 50%;
        margin: auto;
        color: white;
        margin-bottom: 50px;
        font-size: 40px;
        text-align: center;
    }
    body{
        background-color: chocolate;
    }
</style>
<body>
    <div class="box">Table Generator</div>
    <script>
        //for loop
        var n = prompt ("Type A Number to create table ....","2")
        
        document.write("<h1>Table of "+n+"</h1>")
         for(var i = 1;i<=10;i++)
         {
            document.write("<h1> "+n+" * "+i+" = "+n*i+"</h1>")
         }

        //  document.write("Loop End")
    </script>
</body>
</html>
