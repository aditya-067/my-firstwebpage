<style>

@keyframes zoom

}


body
{

header
{
background:#87655f;

font-size:50px;
height:100px;

}

.pic
{
display:inline-block;
width:58%;
height:150px;
border-radius:150px;
box-shadow:5px 5px 20px cyan;

transition:0.50s;
}

main
{
display:flex;
width:90px%;
margin:auto;
flex-wrap:wrap;
//animation:zoom 2s;
}

.pic:hover
{
transform:scale(1.20);
border-radius:0px;
}

</style>
