<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .background{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }

        .background .logo{
            width: 150px;
            height: max-content;
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .background .logo .brush1{
            width: 50px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            animation: height 0.5s ease forwards;
            animation-delay: 4s;
        }

        .background .logo .brush1 .color{
            width: 100%;
            height: 100%;
            background-color: rgb(194, 0, 0);
            position: relative;
            z-index: 2;
            animation: moveup 0.5s ease forwards;
            
        }

        .background .logo .brush2{
            width: 50px;
            height: 220px;
            display: flex;
            align-items: flex-end;
        }

        .background .logo .brush2 .color2{
            width: 100%;
            height: 0;
            background-color: rgb(194, 0, 0);
            animation: moveup 0.5s ease forwards;
            animation-delay: 1s;
        }

        .background .logo .brush3{
            width: 50px;
            height: 220px;
            position: absolute;
            z-index: 2;
            transform: skew(24.4deg);
            transform-origin: top left;
            background-color: red;
            box-shadow:0 0 20px rgba(0, 0, 0,0.33 );
            animation: moveup 0.5s ease forwards;
             animation-delay: 0.5s;
        }

        .lines{
            width: max-content;
            height: 100%;
            display: none;
            justify-content: space-evenly;
            position: absolute;
            z-index: 0;
        }
        .lines .line{
            width: 1px;
            height: 100%;
            background-color: red;
            margin-right: 1px;
            animation: margin 2s linear forwards, bgcolor 0.2s linear forwards;
            animation-delay: 0.2s;
             filter: blur(1px);
        }
        .background::after{
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,0,0,0.2) 0%, black 70%);
    opacity: 0;
    animation: flash 1s ease forwards;
    animation-delay: 4s;
}
.background{
    animation: zoom 4s ease forwards;
}

@keyframes zoom{
    0%{
        transform: scale(0.8);
    }
    100%{
        transform: scale(1);
    }
}

@keyframes flash{
    0%{opacity:0;}
    50%{opacity:1;}
    100%{opacity:0;}
}

        @keyframes moveup{
            from{
                height: 0;
            }to{
                height: 220px;
            }
        }


        
        @keyframes movedown{
            from{
                height: 220px;
            }to{
                height: 0;
            }
        }

        @keyframes opacity {
            0%{
                opacity: 1;
            }100%{
                opacity: 0;
            }
        }
        @keyframes margin {
            0%{
                width: 1px;
                margin-right: 1px;
                box-shadow: none;
            }100%{
                width: 40px;
                margin-right: var(--m);
                box-shadow: 0 0 5px rgb(172, 172, 172), 0 0 50px var(--c);
                
                box-shadow:0 0 5px white,0 0 10px var(--c),0 0 30px var(--c),0 0 60px var(--c);
            }
        }

        @keyframes bgcolor{
            0%{
                background-color: red;
            }30%{
                background: radial-gradient(circle,rgba(255, 0, 0, 1) 75%, rgba(0, 0, 0 0.545) 100%);
            }100%{
                background-color: var(--c);
            }
        }

        @keyframes height{
            0%{
                width: 50px;
                height: 220px;
            }100%{
                width: max-content;
                height: 100vh;
            }
        }
    </style>
</head>

<body>
    <div class="background">
        <div class="logo">
            <div class="brush1">
                <div class="color"></div>
                <div class="lines"></div>
            </div>
            <div class="brush2">
                <div class="color2"></div>
            </div>
            <div class="brush3"></div>


        </div>
    </div>
    <script>
  const stick1 = document.getElementsByClassName("color")[0]
const stick2 = document.getElementsByClassName("color2")[0]
const stick3 = document.getElementsByClassName("brush3")[0]
const lines = document.getElementsByClassName("lines")[0]

setTimeout(()=>{
    stick2.style.animation = "movedown 0.5s ease forwards"
},3000)

setTimeout(()=>{
    stick3.style.animation = "movedown 0.5s ease forwards"
},3500)

setTimeout(()=>{
    stick1.style.animation = "opacity 0.5s ease forwards"
    lines.style.display = 'flex'
},4000)

let colors = [
    '#133286',
    '#3062af',
    '#FFF',
    '#4a7fcb',
    '#133286',
    '#3062af',
    '#628ace',
    '#949fd9',
    '#821e12',
    '#c34821',
    'red',
    '#d3ad94',
    'yellow',
    '#821e12',
    '#462652',
    '#b16f67',
    '#d3ad94',
    '#821e12',
    '#462652',
    '#4a7fcb',
    '#133286',
    '#3062af',
    '#628ace',
    '#b16f67',
    '#d3ad94',
    'yellow',
    '#821e12',
    '#821e12',
    '#c34821',
    '#821e12',
    '#c34821',
    'red',
]

colors.map((clr)=>{
    const line = document.createElement('div');
    const randomMargin = Math.floor(Math.random()* 300);

    const delay = Math.random() * 2; 

    line.className = 'line';
    line.style.setProperty('--m',`${randomMargin}px`);
    line.style.setProperty('--c', clr);

    line.style.animationDelay = `${delay}s`; 

    lines.appendChild(line)
})

    </script>
</body>
</html>
