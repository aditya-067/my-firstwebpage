<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .heading{
            /* text-align: center; */
            font-size: 50px;
            margin-bottom: 50px;
        }
        body{
            margin-left: 50px;
            background-color: black;
            color: whitesmoke;
        }

    </style>
  </head>
  <body>
    <h1 class="heading">progress-bar</h1>

    <div class="progress" style="width: 60%; height: 20px;">
  <div id="green" class="progress-bar progress-bar-striped progress-bar-animated bg-danger" style="width: 0%"><span id="data">0</span></div>
</div>

<h1 class="heading mt-5 mb-5">Striped</h1>

<div class="progress mb-5" style="width: 60%; height: 20px;" >
  <div class="progress-bar progress-bar-striped" style="width: 10%"></div>
</div>
<div class="progress mb-5" style="width: 60%; height: 20px;">
  <div class="progress-bar progress-bar-striped bg-success" style="width: 25%"></div>
</div>
<div class="progress mb-5" style="width: 60%; height: 20px;">
  <div class="progress-bar progress-bar-striped bg-info" style="width: 50%"></div>
</div>
<div class="progress mb-5" style="width: 60%; height: 20px;">
  <div class="progress-bar progress-bar-striped bg-warning" style="width: 75%"></div>
</div>
<div class="progress mb-5" style="width: 60%; height: 20px;">
  <div class="progress-bar progress-bar-striped bg-danger" style="width: 100%"></div>
</div>
  

<h1 class="heading mt-5 mb-5" >Animated stripes</h1>

<div class="progress" style="width: 60%; height: 20px;">
  <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 75%"></div>
</div>


<nav aria-label="Page navigation example">
  <ul class="pagination mt-5 ">
    <li class="page-item"><a class="page-link" href="#">Previous</a></li>

    <li class="page-item"><a class="page-link" href="buttons.html">3</a></li>
    <li class="page-item"><a class="page-link" href="#">Next</a></li>
  </ul>
</nav>
<script>
    var d = document.getElementById("green")
    var t = document.getElementById("data")


    var n = 0;

    setInterval(function(){
        if(n<100)
    {
        n+=10
    }
     else { 

        
       n=0

    }
    d.style.width=n+"%"
    t.innerHTML = n+"%"
    document.title = n
   
    } 

    ,300)
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
